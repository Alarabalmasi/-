name: Verify Zid integration (read-only)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/verify-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source compiles without network calls
        run: |
          node --check src/cli/run.ts
          node --check src/connectors/zid/index.ts
      - name: Unit tests (no credentials)
        run: npm test
      - name: Mock dry-run (no writes)
        run: npm run dry-run
